<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="monetag" content="9a47f359b6e91e74211a8ad2a8d125f1" />
    <title>Purple Canary</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'deep-indigo': '#1a052b',
              'ultra-violet': '#8F00FF',
              'neon-cyan': '#00FFFF',
            },
            animation: {
              'slide-in': 'slideIn 0.4s ease-out forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'scan': 'scan 2s linear infinite',
              'loading-bar': 'loading 2s ease-in-out infinite',
            },
            keyframes: {
              slideIn: {
                '0%': { opacity: '0', transform: 'translateX(20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html, body, #root {
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      
      /* Material Symbols Override for perfect centering */
      .material-symbols-rounded {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
      }

      /* Custom Keyframes for the scanner aesthetic */
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        50% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      @keyframes loading {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .animate-scan {
        animation: scan 2s linear infinite;
      }
      .animate-loading-bar {
        animation: loading 2s ease-in-out infinite;
      }
      /* Typography overrides for the specific V4 aesthetic */
      body {
        background-color: #1a052b;
        color: #e0e0e0;
      }
      /* Utility for mobile scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* HTML content from AI injection */
      .heuristic-output section { margin-bottom: 0.75rem; }
      .heuristic-output h4 { 
        color: #00FFFF; 
        font-size: 9px; 
        font-weight: 800; 
        margin-bottom: 0.25rem; 
        text-transform: uppercase; 
        border-bottom: 1px solid rgba(143, 0, 255, 0.3); 
      }
    </style>
